[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "Daytona + LiteLLM data analyst example in Python"
authors = [
    {name = "Daytona Team", email = "support@daytona.io"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "litellm>=1.0.0,<2.0.0",
    "daytona>=0.1.0,<1.0.0",
]

[tool.setuptools]
py-modules = []
