[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anakin-research-agent"
version = "0.1.0"
description = "Daytona + Anakin research agent example in Python"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "anakin-sdk>=0.2.0,<0.3.0",
    "daytona>=0.227.3,<1.0.0",
    "litellm[mcp]>=1.108.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.setuptools]
py-modules = []
