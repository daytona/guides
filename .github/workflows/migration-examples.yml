name: Migration workflow examples

on:
  pull_request:
    paths:
      - 'python/migration-workflow/**'
      - 'typescript/migration-workflow/**'
      - '.github/workflows/migration-examples.yml'
  push:
    branches: ['docs/migration-examples-v2']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
        working-directory: python/migration-workflow
      - run: python3 -m unittest -v
        working-directory: python/migration-workflow
      - run: npm ci --ignore-scripts && npm test
        working-directory: typescript/migration-workflow
